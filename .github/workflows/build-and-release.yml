name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  release:
    types: [ created, published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/PDFMaster-v1.0.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFMaster-v1.0.0-debug.apk
          path: release-artifacts/PDFMaster-v1.0.0-debug.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: v1.0.0
          files: release-artifacts/PDFMaster-v1.0.0-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
